<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灰階經建地形圖產生器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#1c2731; --muted:#5d6b77; --rule:#cfd8e0; --rule-soft:#e9eef2;
  --sky:#b6cfe7; --sky-edge:#94b4d3; --survey:#24577f; --survey-soft:#e3edf6;
  --go:#3b6a31; --go-hover:#2f5727; --alert:#c11f2a; --paper:#fff;
  --drawer-w:318px; --mL:48px; --mR:48px; --mT:30px; --mB:30px;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font)}
button,input,select{font-family:inherit}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px}

/* ---------- 標題列 ---------- */
.topbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:10px 16px;background:var(--sky);border-bottom:1px solid var(--sky-edge)}
.topbar h1{margin:0 auto 0 0;font-size:27px;font-weight:700;letter-spacing:.14em;color:#17324a}
.status{display:flex;align-items:center;gap:8px;min-height:38px;padding:6px 12px;background:#fff;border:1px solid var(--sky-edge);border-radius:6px;font-size:14px;max-width:min(560px,100%)}
.status .dot{width:14px;height:14px;border-radius:3px;background:#9aa7b2;flex:none;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.status[data-state="ok"] .dot{background:#2f8f3a}
.status[data-state="ok"] .dot::after{content:"✓"}
.status[data-state="loading"] .dot{background:#d08a00}
.status[data-state="error"] .dot{background:var(--alert)}
.status[data-state="error"] .dot::after{content:"!"}
.status span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1px solid var(--sky-edge);border-radius:6px;background:#fff;color:#17324a;font-size:14px;cursor:pointer}
.hbtn:hover{background:var(--survey-soft)}
.hbtn svg{width:16px;height:16px;flex:none}

/* ---------- 工具列 ---------- */
.toolbar{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:10px 12px 8px}
.toolbar .group{display:flex;gap:10px;flex-wrap:wrap}
.toolbar .sep{width:1px;background:var(--rule);margin:4px 6px}
.tbtn{width:96px;min-height:68px;padding:6px 10px;border:2px solid var(--survey);border-radius:2px;background:#fff;color:var(--survey);font-size:16px;font-weight:500;line-height:1.35;cursor:pointer;word-break:break-all}
.tbtn:hover{background:var(--survey-soft)}
.tbtn[aria-pressed="true"]{border-color:var(--alert);box-shadow:inset 0 0 0 1px var(--alert);color:#122c42}
.tbtn.go{background:var(--go);border-color:var(--go);color:#fff}
.tbtn.go:hover{background:var(--go-hover)}
.tbtn.go[aria-pressed="true"]{background:#7a2a1a;border-color:#7a2a1a;box-shadow:none}
.tbtn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 地圖區 ---------- */
#mapWrap{position:relative;width:100%;height:600px;background:#fff;touch-action:none}
#frameCanvas{position:absolute;inset:0;pointer-events:none;z-index:5}
#map{position:absolute;left:var(--mL);right:var(--mR);top:var(--mT);bottom:var(--mB);background:#fff;z-index:1}
#map.leaflet-container{background:#fff}
#mapWrap.locked #map{outline:2px solid var(--alert);outline-offset:0}
.leaflet-container{font-family:var(--font)}
.vec-canvas,.grid-canvas{position:absolute;left:0;top:0;pointer-events:none}
.rh{position:absolute;z-index:8;background:transparent}
.rh-e{top:var(--mT);bottom:var(--mB);right:0;width:12px;cursor:ew-resize}
.rh-s{left:var(--mL);right:var(--mR);bottom:0;height:12px;cursor:ns-resize}
.rh-se{right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#8796a3 50%,#8796a3 58%,transparent 58%,transparent 70%,#8796a3 70%,#8796a3 78%,transparent 78%)}
.rh:hover{background-color:rgba(36,87,127,.12)}
.rh-se:hover{background-color:rgba(36,87,127,.12)}
#mapWrap.locked .rh{display:none}

.ctrlstack{position:absolute;z-index:6;top:calc(var(--mT) + 10px);right:calc(var(--mR) + 10px);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.zoombox,.actbox,.basebox{box-sizing:border-box;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(255,255,255,.95);border:1px solid #b9c4cd;border-radius:6px;font-family:var(--font);font-size:15px;line-height:1.2;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.basebox{position:absolute;z-index:6;top:calc(var(--mT) + 10px);left:calc(var(--mL) + 10px);gap:6px}
.basebox select{height:30px;padding:0 6px;line-height:1.2;border:1px solid #9fb0bf;border-radius:4px;background:#fff;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.actbox{gap:8px}
.abtn{height:30px;padding:0 16px;line-height:1.2;border:1px solid #9fb0bf;border-radius:4px;background:#fff;color:var(--ink);font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.abtn:hover{background:var(--survey-soft)}
.abtn.confirm,.abtn.go{background:var(--go);border-color:var(--go);color:#fff}
.abtn.confirm:hover,.abtn.go:hover{background:var(--go-hover)}
.abtn.confirm[aria-pressed="true"]{background:var(--alert);border-color:var(--alert);color:#fff}
.abtn.confirm[aria-pressed="true"]:hover{background:#9d1822}
.zoombox input{width:130px;accent-color:var(--survey)}
.zoombox .zval{font-variant-numeric:tabular-nums;min-width:22px;font-weight:700}
.zoombox .zscale{font-size:12px;color:var(--muted);white-space:nowrap}
.zoombox.locked input{opacity:.4}
.a4btns{display:flex;gap:4px;padding-left:8px;border-left:1px solid var(--rule)}
.a4btns button{height:26px;padding:0 8px;border:1px solid #9fb0bf;border-radius:4px;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
.a4btns button:hover{background:var(--survey-soft)}
.zoombox.locked .a4btns{display:none}
.zoombox.compact .zscale{display:none}
.zoombox.compact input{width:90px}

.legend{position:absolute;z-index:6;left:calc(var(--mL) + 10px);bottom:calc(var(--mB) + 10px);min-width:200px;max-width:min(420px,60%);max-height:55%;overflow:auto;padding:8px 12px 10px;background:rgba(255,255,255,.96);border:1px solid #9aa6b0;border-radius:4px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.legend header{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.legend header b{font-size:14px}
.legend header small{color:var(--muted)}
.legend header button{margin-left:auto;border:0;background:none;color:var(--survey);cursor:pointer;font-size:12px;padding:0}
.legend .lg-rows{display:flex;flex-direction:column;gap:2px}
.legend .lg-row{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:2px 4px;border-radius:3px;cursor:grab;touch-action:none;user-select:none}
.legend .lg-row:hover{background:#eef3f7}
.legend .lg-row:focus-visible{outline:2px solid var(--survey);outline-offset:0}
.legend .lg-row.dragging{background:#dfe9f2;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:grabbing}
.legend .lg-row.fixed{cursor:default}
.legend .lg-row.fixed:hover{background:none}
.legend .lg-grip{width:10px;color:#8a97a3;font-size:13px;line-height:1}
.legend .empty{color:var(--muted)}
.legend .lg-opt{display:flex;gap:6px;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--muted)}
.legend .lg-opt label{display:flex;gap:6px;align-items:center;cursor:pointer}
.legend .lg-opt button{margin-left:auto;border:0;background:none;color:var(--survey);cursor:pointer;font-size:12px;padding:0}
.legend.min .lg-rows,.legend.min .lg-opt,.legend.min .empty{display:none}

.busy{position:absolute;z-index:6;right:calc(var(--mR) + 10px);bottom:calc(var(--mB) + 10px);padding:4px 10px;background:rgba(28,39,49,.86);color:#fff;border-radius:12px;font-size:12px;display:none}
.busy.on{display:block}

/* 遮罩標示 */
.mask-label{pointer-events:none}
.mask-label div{transform:translate(-50%,-50%);width:max-content;padding:6px 10px;background:#fff;border:1px solid #7b8792;color:#3d4851;font-size:13px;text-align:center;line-height:1.5}

/* ---------- 註記文字方塊 ---------- */
.anno-icon{background:none;border:0}
.anno-box{position:absolute;left:0;top:0;transform-origin:50% 50%;padding:2px 6px;white-space:nowrap;line-height:1.15;color:#000;border:1px dashed rgba(36,87,127,.55);background:transparent;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 4px #fff;cursor:default;user-select:none}
.anno-box .anno-text{display:block;outline:none}
.anno-box .anno-text[contenteditable="true"]{background:#fffbe6;cursor:text;user-select:text}
.anno-box .ah{position:absolute;width:18px;height:18px;padding:0;border:1px solid #6a7782;border-radius:50%;background:#fff;color:#1c2731;font:700 11px/16px var(--font);text-shadow:none;cursor:pointer;opacity:0;transition:opacity .12s;display:grid;place-items:center}
.anno-box .ah-rot{left:-11px;top:-11px;cursor:grab}
.anno-box .ah-rot em{position:absolute;left:20px;top:-1px;font-style:normal;font-size:10px;font-weight:500;background:#fff;border:1px solid #c6ced5;padding:0 3px;border-radius:3px;white-space:nowrap}
.anno-box .ah-del{right:-11px;top:-11px;color:var(--alert);font-size:13px}
.anno-box .ah-move{left:-11px;bottom:-11px;cursor:move}
.anno-box:hover .ah,.anno-box.is-active .ah{opacity:1}
.anno-box.is-active{border-color:var(--alert);border-style:solid;z-index:1}
.anno-box .ah-bg{right:-11px;bottom:-11px;font-size:10px}
.anno-box.bg{background:#fff;text-shadow:none}
.anno-box.restricted .ah-rot,.anno-box.restricted .ah-move,.anno-box.restricted .ah-bg{display:none}
.anno-box.sym .ah-rot,.anno-box.sym .ah-bg{display:none}
.anno-box.pt{left:7px;transform-origin:50% 50%;padding:1px 4px}
.anno-box.pt.noname{left:0;width:16px;height:16px;padding:0}
.anno-box.sym{padding:0;line-height:0}
.anno-box.sym canvas{display:block;width:30px;height:30px}
body.anno-clean .anno-box{border-color:transparent}
body.anno-clean .anno-box .ah{display:none}

/* ---------- 右側圖層選單 ---------- */
.drawer{position:fixed;right:0;top:160px;height:calc(100vh - 170px);width:var(--drawer-w);max-width:88vw;display:flex;z-index:1200;background:#fff;border:1px solid var(--rule);border-right:0;box-shadow:-6px 0 18px rgba(20,40,60,.14);transition:transform .25s ease}
.drawer.collapsed{transform:translateX(100%)}
.drawer-tab{position:absolute;left:-34px;top:10px;width:34px;padding:12px 0 10px;border:0;border-radius:6px 0 0 6px;background:var(--alert);color:#fff;font-size:15px;font-weight:700;line-height:1.3;text-align:center;cursor:pointer;box-shadow:-2px 2px 6px rgba(0,0,0,.18)}
.drawer-tab span{display:block}
.drawer-tab::after{content:"▸";display:block;margin-top:6px;font-size:11px}
.drawer.collapsed .drawer-tab::after{content:"◂"}
.drawer-body{flex:1;overflow:auto;overscroll-behavior:contain}
.sec{border-bottom:1px solid var(--rule)}
.sec-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f2f5f8;border-bottom:1px solid var(--rule-soft)}
.sec-head button{flex:1;display:flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--ink);font-size:16px;font-weight:700;text-align:left;cursor:pointer}
.sec-head button::before{content:"▼";font-size:12px;transition:transform .15s}
.sec.closed .sec-head button::before{transform:rotate(-90deg)}
.sec.closed .sec-body{display:none}
.sec-head small{color:var(--muted);font-size:12px}
.sec-opts{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px;border-bottom:1px solid var(--rule-soft);font-size:13px;color:var(--muted)}
.sec-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.row{display:grid;grid-template-columns:18px 36px minmax(0,1fr) 84px 26px;align-items:center;gap:6px;padding:5px 10px 5px 12px;border-bottom:1px solid var(--rule-soft);font-size:14px}
.row:hover{background:#fafbfc}
.row input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:#1c2731}
.row canvas{width:36px;height:16px;display:block}
.row label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.row input[type=range]{width:84px;accent-color:#1c2731}
.row output{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row.anno{grid-template-columns:18px minmax(0,1fr) auto}
.row.anno small{color:var(--muted);font-size:11px;text-align:right;max-width:120px;line-height:1.3}
.row.anno .raw{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.sec-foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px}
.sbtn{height:32px;padding:0 12px;border:1px solid #9fb0bf;border-radius:4px;background:#fff;color:var(--ink);font-size:13px;cursor:pointer}
.sbtn:hover{background:var(--survey-soft)}
.sbtn[aria-pressed="true"]{background:#1c2731;border-color:#1c2731;color:#fff}
.anno-tools{display:grid;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule-soft);font-size:13px}
.anno-tools .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.anno-tools input[type=range]{flex:1;accent-color:#1c2731}
.note{padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.6}
.note b{color:var(--ink)}

/* ---------- 提示、輸出 ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:3000;max-width:min(560px,92vw);padding:10px 16px;background:#1c2731;color:#fff;border-radius:6px;font-size:14px;line-height:1.5;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;z-index:2500;display:grid;place-items:center;background:rgba(20,30,40,.45)}
.overlay[hidden]{display:none}
.overlay .card{min-width:300px;padding:20px 24px;background:#fff;border-radius:8px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.overlay progress{width:100%;margin-top:12px}
.leaflet-popup-content{font-size:12px;max-height:280px;overflow:auto;margin:10px 12px}
.leaflet-popup-content table{border-collapse:collapse}
.leaflet-popup-content td{border-bottom:1px solid #eee;padding:1px 6px 1px 0;vertical-align:top}
.leaflet-popup-content h4{margin:8px 0 2px;font-size:13px}
.leaflet-popup-content h4:first-child{margin-top:0}
.dropping #mapWrap::after{content:"放開以載入 .pmtiles 檔";position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(36,87,127,.18);border:3px dashed var(--survey);font-size:22px;color:#17324a}

@media (prefers-reduced-motion: reduce){ .drawer,#toast,.anno-box .ah{transition:none} }
@media (max-width:760px){
  .topbar h1{font-size:21px}
  .tbtn{width:78px;min-height:58px;font-size:14px}
  :root{--mL:40px;--mR:40px}
}
</style>
</head>
<body>

<header class="topbar">
  <h1>灰階經建地形圖產生器</h1>
  <div class="status" id="status" data-state="idle" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">尚未載入向量圖磚（.pmtiles）</span></div>
  <label class="hbtn" title="選擇電腦中的 .pmtiles 檔；也可直接拖曳到地圖上">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5h5l1.5 1.5h6.5v8.5h-13z" fill="#f2b632" stroke="#b07a0c"/></svg>
    載入本機 .pmtiles 檔<input type="file" id="fileInput" accept=".pmtiles,.json" multiple hidden>
  </label>
</header>


<main>
  <div id="mapWrap">
    <div id="map" aria-label="地圖"></div>
    <canvas id="frameCanvas" aria-hidden="true"></canvas>

    <div class="basebox" id="basebox">
      <label for="baseSelect">底圖：</label>
      <select id="baseSelect" aria-label="切換底圖">
        <option value="emap">通用電子地圖</option>
        <option value="google">谷歌地圖</option>
        <option value="photo">通用正射影像</option>
        <option value="topo">經建版地形圖（1/25000）</option>
        <option value="bao">台灣堡圖</option>
        <option value="none">關閉底圖</option>
      </select>
    </div>

    <div class="ctrlstack" id="ctrlStack">
    <div class="zoombox" id="zoombox">
      <label for="zoomSlider">比例尺 (Zoom)：<span class="zval" id="zoomVal">8</span></label>
      <input type="range" id="zoomSlider" min="7" max="17" step="1" value="8">
      <span class="zscale" id="zoomScale"></span>
      <span class="a4btns" role="group" aria-label="把地圖框調成 A4 比例">
        <button type="button" data-a4="land" title="把地圖框調成 A4 橫式的比例">A4 橫</button>
        <button type="button" data-a4="port" title="把地圖框調成 A4 直式的比例">A4 直</button>
      </span>
    </div>
    <div class="actbox" role="group" aria-label="確定範圍與輸出">
      <button class="abtn confirm" type="button" id="btnConfirm" aria-pressed="false">確定範圍</button>
      <button class="abtn go" type="button" id="btnExport" title="輸出 A4、300 dpi 黑白 PNG（不含底圖）">輸出圖檔</button>
    </div>
    </div>

    <section class="legend" id="legend" aria-label="圖例">
      <header><b>圖例（灰階印刷）</b><small>拖曳排序｜右側調色</small><button type="button" id="legendMin" aria-expanded="true">收合</button></header>
      <div class="empty" id="legendEmpty">尚未勾選圖層</div>
      <div class="lg-rows" id="legendRows"></div>
      <div class="lg-opt"><label><input type="checkbox" id="legendExport" checked>輸出圖檔時附上圖例</label>
        <button type="button" id="legendReset" hidden>恢復預設順序</button></div>
    </section>

    <div class="busy" id="busy"></div>
    <div class="rh rh-e" data-mode="e" title="拖曳調整寬度（雙擊恢復）"></div>
    <div class="rh rh-s" data-mode="s" title="拖曳調整高度（雙擊恢復）"></div>
    <div class="rh rh-se" data-mode="es" title="拖曳調整寬度與高度（雙擊恢復）"></div>
  </div>
</main>

<aside class="drawer" id="drawer" aria-label="圖層選單">
  <button class="drawer-tab" id="drawerTab" type="button" aria-expanded="true" aria-label="圖層選單"><span>圖</span><span>層</span><span>選</span><span>單</span></button>
  <div class="drawer-body">
    <section class="sec" data-group="point">
      <div class="sec-head"><button type="button">1. 點圖層 (Point)</button><small>灰階</small></div>
      <div class="sec-body">
        <div class="sec-opts"><span>勾選建物符號、交通設施後，地圖上會顯示名稱，可按方塊右上角 × 刪除個別的點。</span>
          <button class="sbtn" type="button" id="ptRestore" hidden>恢復已刪除的點</button></div>
      </div>
    </section>
    <section class="sec" data-group="line">
      <div class="sec-head"><button type="button">2. 線圖層 (Line)</button><small>灰階</small></div>
      <div class="sec-body">
        <div class="sec-opts"><label><input type="checkbox" id="optContourLabel" checked>計曲線標註高程</label></div>
      </div>
    </section>
    <section class="sec" data-group="polygon">
      <div class="sec-head"><button type="button">3. 面圖層 (Polygon)</button><small>灰階</small></div>
      <div class="sec-body"></div>
    </section>
    <section class="sec" data-group="anno" id="annoSec" hidden>
      <div class="sec-head"><button type="button">4. 註記 (Annotation)</button><small id="annoCount"></small></div>
      <div class="sec-body">
        <div class="anno-tools">
          <div class="line"><span>字級</span><input type="range" id="annoScale" min="60" max="180" step="5" value="100"><output id="annoScaleVal">100%</output></div>
          <div class="line"><label><input type="checkbox" id="annoBgAll"> 文字加白底遮罩（套用全部，個別方塊可按右下角 ▣ 切換）</label></div>

/* ============================================================

const MERC = {

async function loadTileSet(store, dz, minX, minY, maxX, maxY, onProgress, isCancelled) {

  const y0 = Math.max(0, Math.floor(minY / 256)), y1 = Math.min(n - 1, Math.floor((maxY - 1e-6) / 256));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) list.push({ x, y, layers: null });

}
/** 合併使用者存過的順序與預設順序（新圖層插回其預設位置） */
function mergeOrder(saved) {

  if (!Array.isArray(saved)) return def;

/* ============================================================

function exportLayout(size) {

async function useArchive(arc, label, silent) {
  const h = arc.header;
  if (h.tileType !== 1) throw new Error('此檔不是向量圖磚（MVT）');
  state.archive = arc; state.store = new TileStore(arc);
  setStatus('ok', `已載入：${label}（Zoom ${h.minZoom}~${h.maxZoom}）`);
  requestVectorRedraw(true);
  if (state.locked) scanAnnoLayers();
  if (!silent && !enabledVectorIds(state.enabled).length) toast('已載入。請在右側「圖層選單」勾選要顯示的圖層。');
}
async function openArchive(src) {
  setStatus('loading', `讀取中：${src.name}…`);
  try {
    const arc = await new PMTilesArchive(src).init();
    const mb = src.size ? `${(src.size / 1048576).toFixed(1)} MB｜` : '';
    await useArchive(arc, src.name, false);
    setStatus('ok', `已載入：${src.name}（${mb}Zoom ${arc.header.minZoom}~${arc.header.maxZoom}）`);
  } catch (err) { console.error(err); setStatus('error', `無法讀取 ${src.name}：${err.message}`); }
}
async function openPartitioned(index, makeSource, label, silent) {
  if (!silent) setStatus('loading', `讀取中：${label}…`);
  const arc = await new PartitionedArchive(index, makeSource).init();
  const mb = index.total_bytes ? `${(index.total_bytes / 1048576).toFixed(0)} MB｜` : '';
  await useArchive(arc, '', silent);
  setStatus('ok', `已載入：${label}（${index.tiles.length + (index.overview ? 1 : 0)} 個檔｜${mb}Zoom ${arc.header.minZoom}~${arc.header.maxZoom}）`);
}
/** 由選取的檔案（可能來自資料夾）建立分割圖磚 */
async function openLocalFiles(files) {
  files = [...files];
  const pm = files.filter(f => /\.pmtiles$/i.test(f.name));
  if (files.length === 1 && pm.length === 1) return openArchive(new FileSource(pm[0]));
  if (!pm.length) { toast('沒有找到 .pmtiles 檔'); return; }
  try {
    const byName = new Map(pm.map(f => [f.name, f]));
    const idxFile = files.find(f => f.name === 'index.json');
    let index;
    if (idxFile) index = JSON.parse(await idxFile.text());
    else {
      const parts = pm.map(f => f.name.match(/^(\d+)-(\d+)-(\d+)\.pmtiles$/)).filter(Boolean);
      if (!parts.length) { if (pm.length === 1) return openArchive(new FileSource(pm[0])); throw new Error('找不到 index.json，檔名也不是「z-x-y.pmtiles」格式'); }
      index = { format: 'gray-topo-partition', min_zoom: 7, max_zoom: 15, partition_zoom: +parts[0][1],
        overview: byName.has('overview.pmtiles') ? 'overview.pmtiles' : null, tiles: parts.map(m => `${m[1]}-${m[2]}-${m[3]}`) };
    }
    index.total_bytes = pm.reduce((a, f) => a + f.size, 0);
    await openPartitioned(index, name => { const f = byName.get(name); if (!f) throw new Error('缺少檔案 ' + name); return new FileSource(f); }, '本機分割圖磚', false);
  } catch (err) { console.error(err); setStatus('error', '無法讀取分割圖磚：' + err.message); }
}
async function openRemote(url, silent) {
  try {
    if (/\.json(\?|$)/i.test(url)) {
      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const index = await res.json(), base = new URL(url, location.href);
      await openPartitioned(index, name => new UrlSource(new URL(name, base).href), '線上分割圖磚', silent);
    } else await openArchive(new UrlSource(url));
  } catch (err) {
    if (silent) { console.info('未找到預設圖磚', url, err.message); return; }
    console.error(err); setStatus('error', `無法讀取 ${url}：${err.message}`);
  }
}

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {

  const fs = [...(e.dataTransfer?.files || [])].filter(x => /\.(pmtiles|json)$/i.test(x.name));
  if (fs.length) openLocalFiles(fs); else toast('請拖曳 .pmtiles 檔（分割圖磚可一次拖曳全部檔案與 index.json）');
});

const annoRows = $('#annoRows');
async function scanAnnoLayers() {
  if (!state.store) { annoRows.innerHTML = '<p class="note">請先載入 .pmtiles 檔，才能讀取註記圖層。</p>'; return; }
  annoRows.innerHTML = '<p class="note">正在搜尋此範圍內的註記圖層…</p>';

  try { ({ tiles } = await viewTiles()); } catch (err) { annoRows.innerHTML = `<p class="note">讀取失敗：${err.message}</p>`; return; }
  const found = new Map();
  for (const t of tiles) {
    if (!t.layers) continue;
    for (const name in t.layers) {
      if (KNOWN_VECTOR.has(name)) continue;
      const fs = layerFeatures(t.layers[name]);
      if (!fs.length || fs[0].type !== 1 || pget(fs[0].props, 'textstring') === undefined) continue;
      found.set(name, (found.get(name) || 0) + fs.filter(f => f.parts.some(p => p[0] >= 0 && p[1] >= 0 && p[0] < f.ext && p[1] < f.ext)).length);
    }

  state.annoLayers = [...found].map(([name, count]) => ({ name, count, cls: annoClassOf(name) }));
  renderAnnoRows();
}
function renderAnnoRows() {
  annoRows.innerHTML = '';

  }

    if (g.other && !shownOther) { shownOther = true; const p = document.createElement('p'); p.className = 'note'; p.innerHTML = '<b>其他註記圖層</b>（未對應到上述類別；可在程式 CONFIG.ANNO_LAYER_CLASS 指定）'; annoRows.appendChild(p); }
    const row = document.createElement('div'); row.className = 'row anno';

    row.querySelector('.raw').textContent = g.layers.length ? g.layers.map(l => l.name).join('、') : '此範圍內無此類圖層';
    row.querySelector('small').textContent = g.layers.length ? `${count} 筆` : '';

    chk.disabled = !g.layers.length;
    chk.checked = state.annoClassOn.has(g.key);
    const small = row.querySelector('small');
    const load = async () => {
      chk.disabled = true;
      const r = await addAnnoGroup(g.key, g.layers.map(l => l.name));
      chk.disabled = false;
      small.textContent = r.dup ? `顯示 ${r.added} 筆｜${r.dup} 筆與建物、交通名稱重複未顯示` : `顯示 ${r.added} 筆`;
    };

function estimateFontPx(props, text, lat) {
  const bw = numOrNull(pget(props, 'box_w_m')), bh = numOrNull(pget(props, 'box_h_m'));
  const ang = Math.abs((numOrNull(pget(props, 'angle')) || 0) * Math.PI / 180);
  const n = Math.max(1, [...String(text)].length);
  // 字級一律採預設值（與確定範圍前的建物、交通名稱相同）；註記方框只用來判斷是否為直書
  const vertical = !!(bw && bh) && n > 1 && ang < 0.05 && bh > bw * 1.6;
  return { px: CONFIG.LABEL_FONT_PX, vertical };
}
/* 註記與建物、交通名稱的重複比對 */
function normName(t) {
  return String(t || '').normalize('NFKC').replace(/[\s·・．.、，,（）()「」]/g, '').replace(/臺/g, '台')
    .replace(/國民小學/g, '國小').replace(/國民中學/g, '國中').replace(/高級中學/g, '高中').replace(/高級職業學校/g, '高職')
    .replace(/火車站/g, '車站').replace(/郵政/g, '郵');
}
function sameName(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  return Math.min(a.length, b.length) >= 2 && (a.includes(b) || b.includes(a));
}
function dedupeRefs() {
  const refs = [];
  for (const it of state.pts.values())
    if (it.text && state.enabled.has(it.layer)) refs.push({ n: normName(it.text), lat: it.plat ?? it.lat, lng: it.plng ?? it.lng });
  if (CONFIG.ANNO_DEDUPE_DELETED) for (const d of state.ptDeletedInfo.values()) refs.push({ n: normName(d.text), lat: d.lat, lng: d.lng });
  return refs.filter(r => r.n);
}
function isDuplicateName(text, lat, lng, refs) {
  const n = normName(text); if (!n) return false;
  const R = CONFIG.ANNO_DEDUPE_RADIUS_M, kx = 111320 * Math.cos(lat * Math.PI / 180);
  return refs.some(r => sameName(n, r.n) && Math.hypot((r.lng - lng) * kx, (r.lat - lat) * 110540) <= R);
}
async function addAnnoGroup(key, names) {
  if (!state.store) return { added: 0, dup: 0 };
  const cls = key.startsWith('c') ? +key.slice(1) : annoClassOf(key.slice(2));
  const refs = CONFIG.ANNO_DEDUPE_CLASSES.includes(cls) ? dedupeRefs() : [];
  let dup = 0;
  busy('讀取註記…');
  const { tiles, dz } = await viewTiles();
  const b = map.getBounds(); let added = 0;
  const existing = new Set([...state.annos.values()].map(a => a.srcId));
  for (const t of tiles) {
    if (!t.layers) continue;
    for (const name of names) {
      const Ly = t.layers[name]; if (!Ly) continue;
      for (const f of layerFeatures(Ly)) {
        const text = pget(f.props, 'textstring');
        if (text === undefined || text === null || String(text).trim() === '') continue;
        for (const p of f.parts) {
          if (p[0] < 0 || p[1] < 0 || p[0] >= f.ext || p[1] >= f.ext) continue;
          const [lat, lng] = MERC.unproject(t.x * 256 + p[0] / f.ext * 256, t.y * 256 + p[1] / f.ext * 256, dz);
          if (!b.contains([lat, lng]) || inRadarMask(lat, lng)) continue;
          const srcId = String(pget(f.props, 'anno_id') ?? `${name}|${text}|${lat.toFixed(6)}|${lng.toFixed(6)}`);
          if (existing.has(srcId) || state.annoDeleted.has(srcId)) continue;
          existing.add(srcId);
          if (refs.length && isDuplicateName(text, lat, lng, refs)) { dup++; continue; }
          const fz = estimateFontPx(f.props, text, lat);
          createAnno({ key, srcId, text: String(text).trim(), lat, lng, rot: -(numOrNull(pget(f.props, 'angle')) || 0),
            fontPx: fz.px, vertical: fz.vertical, family: cssFontFor(pget(f.props, 'fontname')) });
          added++;
        }
      }
    }
  }
  busy('');
  updateAnnoCount();

  return { added, dup };
}
function removeAnnoGroup(key) { for (const a of [...state.annos.values()]) if (a.key === key) removeAnno(a, false); updateAnnoCount(); }
function updateAnnoCount() { $('#annoCount').textContent = state.annos.size ? `${state.annos.size} 個文字方塊` : ''; }
function normAngle(d) { d = ((d % 360) + 540) % 360 - 180; return Math.round(d); }
const PT_LABEL_OFFSET = 7;     // 點名稱方塊與點的水平距離（螢幕像素）
function styleAnno(a) {

  a.box.classList.toggle('restricted', a.kind === 'pt' && !state.locked);
  if (a.kind === 'sym') {
    a.box.style.transform = 'translate(-50%,-50%)';
    const cv = a.box.querySelector('canvas'), c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);

function allItems() { return [...state.annos.values(), ...[...state.pts.values()].filter(p => p.marker)]; }
function setActive(a) { for (const o of allItems()) o.box.classList.toggle('is-active', o === a); }
/** 建立文字方塊。opt.kind：'text'（註記、自訂文字）、'pt'（建物／交通設施名稱）、'sym'（自訂點符號） */
function createAnno(opt, register = true) {

  const box = document.createElement('div'); box.className = 'anno-box ' + a.kind;
  box.innerHTML = (a.kind === 'sym' ? '<canvas width="60" height="60"></canvas>' : '<span class="anno-text"></span>')

  });

/* ---------- 建物、交通設施的點名稱（確定範圍前只能刪除） ---------- */
function syncPointItems(tiles, dz) {
  if (state.locked) return;                       // 確定範圍後不再自動增減
  const want = new Set();
  const layers = PT_LAYERS.filter(id => state.enabled.has(id));
  if (tiles && layers.length) {
    const b = map.getBounds();
    for (const t of tiles) {
      if (!t.layers) continue;
      for (const id of layers) {
        const Ly = t.layers[id]; if (!Ly) continue;
        for (const f of layerFeatures(Ly)) for (const p of f.parts) {
          if (p[0] < 0 || p[1] < 0 || p[0] >= f.ext || p[1] >= f.ext) continue;
          const key = pointKey(f, t, p, dz);
          if (state.ptDeleted.has(key)) continue;
          const [lat, lng] = MERC.unproject(t.x * 256 + p[0] / f.ext * 256, t.y * 256 + p[1] / f.ext * 256, dz);
          if (!b.contains([lat, lng]) || inRadarMask(lat, lng)) continue;
          want.add(key);
          if (!state.pts.has(key)) state.pts.set(key, { key, layer: id, plat: lat, plng: lng, lat, lng, rot: 0, fontPx: CONFIG.LABEL_FONT_PX,
            text: String(pget(f.props, LABEL_FIELD[id]) ?? '').trim(), bg: false, marker: null });
        }
      }
    }
  }
  if (want.size > MAX_PT_BOXES) {
    for (const it of state.pts.values()) if (it.marker) { map.removeLayer(it.marker); it.marker = null; }
    if (!ptWarned) { toast(`畫面內有 ${want.size} 個建物／交通點，名稱方塊太多；請放大地圖後再刪除個別的點。`, 4500); ptWarned = true; }
    return;
  }
  ptWarned = false;
  for (const it of [...state.pts.values()]) {
    const show = want.has(it.key);
    if (show && !it.marker) { const { marker, box, txt, rotBtn, ...data } = it; state.pts.set(it.key, createAnno({ ...data, kind: 'pt', id: 'pt:' + it.key, align: 'left' }, false)); }
    else if (!show && it.marker) { map.removeLayer(it.marker); it.marker = null; }
  }
}

  if (it.marker) map.removeLayer(it.marker);

function dragHandle(el, begin, onClick) {

    ev.preventDefault(); ev.stopPropagation();
    el.setPointerCapture(ev.pointerId);
    const sx = ev.clientX, sy = ev.clientY; let moved = false; const apply = begin(ev);
    const mv = e => { const dx = e.clientX - sx, dy = e.clientY - sy; if (!moved && Math.hypot(dx, dy) < 3) return; moved = true; apply(dx, dy, e); };
    const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); if (!moved && onClick) onClick(); };

  });

});

/* ---------- 查詢屬性 ---------- */
$('#btnInspect').addEventListener('click', e => {
  state.inspect = !state.inspect;
  e.target.setAttribute('aria-pressed', String(state.inspect));
  mapEl.style.cursor = state.inspect ? 'help' : '';
  if (state.inspect) toast('點選地圖上的圖徵即可查看屬性（再按一次「查詢屬性」關閉）');
});
function segDist(px, py, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy;
  let t = L2 ? ((px - x0) * dx + (py - y0) * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - x0 - t * dx, py - y0 - t * dy);
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function inspectAt(latlng) {
  if (!state.store) { toast('請先載入 .pmtiles 檔'); return; }
  const h = state.archive.header, z = map.getZoom(), dz = clampZ(z, h), f = Math.pow(2, z - dz);
  const [gx, gy] = MERC.project(latlng.lat, latlng.lng, dz), tx = Math.floor(gx / 256), ty = Math.floor(gy / 256);
  const layers = await state.store.get(dz, tx, ty);
  const lx = gx - tx * 256, ly = gy - ty * 256, tol = 7 / f;
  const want = new Set(); for (const id of enabledVectorIds(state.enabled)) for (const s of DEF[id].src) want.add(s);
  const html = [];
  for (const name of Object.keys(layers || {})) {
    if (want.size && !want.has(name) && KNOWN_VECTOR.has(name)) continue;
    const Ly = layers[name], sc = 256 / Ly.extent, hits = [];
    for (const ft of layerFeatures(Ly)) {
      let hit = false;
      if (ft.type === 1) hit = ft.parts.some(p => Math.hypot(p[0] * sc - lx, p[1] * sc - ly) <= tol);
      else if (ft.type === 2) hit = ft.parts.some(p => { for (let i = 2; i < p.length; i += 2) if (segDist(lx, ly, p[i - 2] * sc, p[i - 1] * sc, p[i] * sc, p[i + 1] * sc) <= tol) return true; return false; });
      else {
        let inside = false;
        for (const p of ft.parts) for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
          const yi = p[i + 1] * sc, yj = p[j + 1] * sc, xi = p[i] * sc, xj = p[j] * sc;
          if ((yi > ly) !== (yj > ly) && lx < (xj - xi) * (ly - yi) / (yj - yi) + xi) inside = !inside;
        }
        hit = inside;
      }
      if (hit) hits.push(ft);
    }
    if (!hits.length) continue;
    html.push(`<h4>${escapeHtml(name)}${hits.length > 3 ? `（共 ${hits.length} 筆，列出 3 筆）` : ''}</h4>`);
    for (const ft of hits.slice(0, 3)) {
      const rows = Object.entries(ft.props).map(([k, v]) => `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join('');
      html.push(`<table>${rows || '<tr><td>（無屬性）</td></tr>'}</table>`);
    }
  }
  L.popup({ maxWidth: 320 }).setLatLng(latlng).setContent(html.join('') || '此處沒有勾選圖層的圖徵').openOn(map);
}

/* ---------- 輸出圖檔 ---------- */
$('#btnExport').addEventListener('click', async () => {
  const ov = $('#exportOverlay'), prog = $('#exportProg'), msg = $('#exportMsg');
  if (!state.locked) toast('尚未按「確定範圍」，將以目前畫面輸出。');
  if (!state.store && enabledVectorIds(state.enabled).length) toast('尚未載入 .pmtiles，圖檔只會有方格網與註記。', 4000);
  ov.hidden = false; prog.value = 0; msg.textContent = '正在讀取圖磚…';
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const res = await composeExport({
      z: map.getZoom(), pbMin: map.getPixelBounds().min, size: map.getSize(), store: state.store, header: state.archive && state.archive.header,
      enabled: state.enabled, grays: state.grays, contourLabels: state.contourLabels, legend: state.legendExport, order: state.order,
      skipPoints: state.ptDeleted,
      annos: allItems().filter(a => a.kind !== 'pt' || state.enabled.has(a.layer)).map(a => ({ kind: a.kind, sym: a.sym, scale: state.annoScale, lat: a.lat, lng: a.lng, text: a.text, rot: a.rot,
        fontPx: a.fontPx * state.annoScale, family: a.family, vertical: a.vertical, bg: a.bg, align: a.kind === 'pt' && a.text ? 'left' : 'center', offsetPx: PT_LABEL_OFFSET + 5 })),
      onProgress: (d, n) => { prog.value = Math.round(d / n * 90); msg.textContent = `正在讀取圖磚 ${d} / ${n}…`; },
    });
    msg.textContent = '正在壓縮 PNG…'; prog.value = 95;
    const blob = await new Promise(r => res.canvas.toBlob(r, 'image/png'));
    const u8 = pngSetDpi(new Uint8Array(await blob.arrayBuffer()), CONFIG.EXPORT.dpi);
    const url = URL.createObjectURL(new Blob([u8], { type: 'image/png' }));
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const aEl = document.createElement('a');
    aEl.href = url; aEl.download = `灰階經建地形圖_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.png`;
    document.body.appendChild(aEl); aEl.click(); aEl.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    toast(`已輸出 A4 ${res.layout.land ? '橫式' : '直式'}（${res.layout.PW}×${res.layout.PH}，300 dpi），原尺寸列印比例約 1:${res.scale.toLocaleString('en-US')}`, 5000);
  } catch (err) {
    console.error(err); toast('輸出失敗：' + err.message, 5000);
  } finally { ov.hidden = true; }
});

/* ---------- 版面與縮放把手 ---------- */
function layout() {
  const r0 = wrap.getBoundingClientRect();
  if (!state.userSized) { wrap.style.width = ''; wrap.style.height = Math.max(360, window.innerHeight - r0.top - 6) + 'px'; }
  const r = wrap.getBoundingClientRect(), mr = mapEl.getBoundingClientRect();
  const top = Math.max(8, r.top);
  drawer.style.top = top + 'px'; drawer.style.height = Math.max(240, window.innerHeight - top - 8) + 'px';
  const dl = drawer.classList.contains('collapsed') ? window.innerWidth - 34 : drawer.getBoundingClientRect().left - 34;
  zoombox.classList.toggle('compact', Math.min(mr.right, dl) - mr.left < 640);
  const rightEdge = Math.min(mr.right, dl) - 10;
  ctrlStack.style.right = 'auto';
  ctrlStack.style.left = Math.max(mr.left - r.left + 10, rightEdge - r.left - ctrlStack.offsetWidth) + 'px';
  map.invalidateSize({ pan: false });
  scheduleOverlays();
}
document.querySelectorAll('.rh').forEach(hd => {
  const mode = hd.dataset.mode;
  hd.addEventListener('pointerdown', ev => {
    if (state.locked) return;
    ev.preventDefault(); hd.setPointerCapture(ev.pointerId);
    const r = wrap.getBoundingClientRect(), sx = ev.clientX, sy = ev.clientY;
    const mv = e => {
      state.userSized = true;
      if (mode.includes('e')) wrap.style.width = Math.max(420, Math.min(document.documentElement.clientWidth - r.left, r.width + e.clientX - sx)) + 'px';
      if (mode.includes('s')) wrap.style.height = Math.max(300, r.height + e.clientY - sy) + 'px';
      layout();
    };
    const up = () => { hd.removeEventListener('pointermove', mv); hd.removeEventListener('pointerup', up); requestVectorRedraw(true); };
    hd.addEventListener('pointermove', mv); hd.addEventListener('pointerup', up);
  });
  hd.addEventListener('dblclick', () => { if (state.locked) return; state.userSized = false; layout(); requestVectorRedraw(true); });
});
document.querySelectorAll('[data-a4]').forEach(btn => btn.addEventListener('click', () => {
  if (state.locked) return;
  const land = btn.dataset.a4 === 'land';
  const ratio = land ? (210 - 2 * CONFIG.EXPORT.marginMM - CONFIG.EXPORT.footerMM) / (297 - 2 * CONFIG.EXPORT.marginMM)
                     : (297 - 2 * CONFIG.EXPORT.marginMM - CONFIG.EXPORT.footerMM) / (210 - 2 * CONFIG.EXPORT.marginMM);
  const r = wrap.getBoundingClientRect(), mr = mapEl.getBoundingClientRect();
  const padX = r.width - mr.width, padY = r.height - mr.height;
  const maxW = document.documentElement.clientWidth - r.left - (drawer.classList.contains('collapsed') ? 40 : 0);
  const maxH = Math.max(300, window.innerHeight - r.top - 6);
  let w = maxW - padX, h = w * ratio;
  if (h + padY > maxH) { h = maxH - padY; w = h / ratio; }
  state.userSized = true;
  wrap.style.width = Math.round(w + padX) + 'px'; wrap.style.height = Math.round(h + padY) + 'px';
  layout(); requestVectorRedraw(true);
  toast(`地圖框已調成 A4 ${land ? '橫' : '直'}式比例；雙擊右下角把手可恢復原大小`);
}));
window.addEventListener('resize', () => { if (!state.locked) layout(); else scheduleOverlays(); });

/* ---------- 啟動 ---------- */
buildRows();
buildLegend();
layout();
updateZoomUI();
if (window.innerWidth < 900) setDrawer(false);
})();
/*APP-END*/
</script>
</body>
